networks:
  elastic:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
  elasticsearch-certs:
    driver: local

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    mem_limit: 4g
    mem_reservation: 2g
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=true
      - ELASTIC_PASSWORD=ElasticPassword123!
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - target: 9200
        published: 9200
        protocol: tcp
        mode: host
    networks:
      - elastic
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
    ulimits:
      memlock:
        soft: -1
        hard: -1

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      - xpack.monitoring.enabled=false
      - "LS_JAVA_OPTS=-Xmx1g -Xms1g"
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=logstash_writer
      - ELASTICSEARCH_PASSWORD=LogstashWriter123!
    volumes:
      - /opt/elastic/logstash/pipeline:/usr/share/logstash/pipeline/
    ports:
      - target: 5044
        published: 5044
        protocol: tcp
        mode: host
    networks:
      - elastic
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=KibanaPassword123!
      - SERVER_HOST=0.0.0.0
      - SERVER_PUBLICBASEURL=http://157.151.21.36:5601
    ports:
      - target: 5601
        published: 5601
        protocol: tcp
        mode: host
    networks:
      - elastic
    depends_on:
      - elasticsearch